<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Практика позиционирования</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<button id="open-modal-btn">Открыть модальное окно</button>
<div id="modal-overlay" class="modal-overlay hidden">
    <div class="modal-window">
        <button class="close-btn">&times;</button>
        <img src="designs/lightbox.jpg" alt="" class="modal-image">

        <div class="modal-content">
            <div class="progress-container">
                <div class="progress-bg">
                    <span class="progress-label label-dark">Loading...</span>
                </div>

                <div class="progress-fill" style="width: 42%;">
                    <span class="progress-label label-light">Loading...</span>
                </div>
            </div>
        </div>
    </div>
</div>

    <div class="logo-class">
        <img src="designs/logo1.png" alt="1 логотип" class="logo-img">
    </div>

    <div class="logo-class">
        <img src="designs/logo2.png" alt="2 логотип" class="logo-img">
    </div>

    <script src="index.js"></script>
</body>
</html>
